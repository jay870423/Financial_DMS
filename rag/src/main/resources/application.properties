spring.application.name=finance-document-management

# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/finance_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.rag=DEBUG
logging.level.org.springframework.security=INFO

# Spring Configuration
spring.main.banner-mode=off

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# 响应编码配置
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-your-api-key}
spring.ai.openai.chat.options.model=qwen2.5:1.5b
spring.ai.openai.chat.options.temperature=0.7

# Embedding Configuration
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Document Processing Configuration
spring.ai.vector-store.document-chunk-size=1000
spring.ai.vector-store.document-chunk-overlap=200

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT Configuration
jwt.secret=finance_document_management_jwt_secret_key
jwt.expiration=86400000
jwt.refreshExpiration=604800000

# WeChat Login Configuration (Simulated)
wechat.app-id=wx_simulated_app_id
wechat.app-secret=wx_simulated_app_secret
wechat.redirect-uri=http://localhost:8080/wechat/callback

# Storage Configuration
file.storage-limit=12884901888 # 12 GB (in bytes)

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=30s
spring.elasticsearch.socket-timeout=30s
spring.elasticsearch.username=elastic
spring.elasticsearch.password=lyj888888
