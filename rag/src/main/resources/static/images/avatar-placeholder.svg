<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 改进的渐变背景 -->
  <defs>
    <linearGradient id="avatarGradient" x1="-20%" y1="-20%" x2="120%" y2="120%">
      <stop offset="0%" stop-color="#165DFF"/>
      <stop offset="50%" stop-color="#3A7CFF"/>
      <stop offset="100%" stop-color="#0FC6C2"/>
    </linearGradient>
    <!-- 添加微妙的阴影效果 -->
    <filter id="avatarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <!-- 圆形背景带阴影效果 -->
  <circle cx="20" cy="20" r="19" fill="url(#avatarGradient)" filter="url(#avatarShadow)"/>
  <circle cx="20" cy="20" r="19" fill="white" opacity="0.05"/>
  
  <!-- 头像图标 - 精致设计 -->
  <g fill="white" opacity="0.9">
    <!-- 头部轮廓 - 添加高光 -->
    <circle cx="20" cy="18" r="7"/>
    <circle cx="22" cy="16" r="2" opacity="0.7"/>
    
    <!-- 改进的身体轮廓 - 更圆润的设计 -->
    <path d="M14 25C14 24.4477 14.4477 24 15 24H25C25.5523 24 26 24.4477 26 25V31C26 32.1046 25.1046 33 24 33H16C14.8954 33 14 32.1046 14 31V25Z"/>
    
    <!-- 精致的面部特征 -->
    <!-- 眼睛 - 添加眼白效果 -->
    <circle cx="18" cy="17" r="1.2" fill="white"/>
    <circle cx="22" cy="17" r="1.2" fill="white"/>
    <circle cx="18" cy="17" r="0.6" fill="#165DFF"/>
    <circle cx="22" cy="17" r="0.6" fill="#165DFF"/>
    
    <!-- 微笑的嘴巴 -->
    <path d="M17 21C17 21 19 22 23 21" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    
    <!-- 头发/头部装饰 - 增加辨识度 -->
    <path d="M13 16C13 14.8954 13.8954 14 15 14H16L17 12L19 12L20 14H21C22.1046 14 23 14.8954 23 16" fill="white"/>
  </g>
  
  <!-- 高光效果 - 增加立体感 -->
  <circle cx="24" cy="16" r="3" fill="white" opacity="0.15"/>
</svg>