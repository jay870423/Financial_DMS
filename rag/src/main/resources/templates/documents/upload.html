    <!-- JavaScript for file upload functionality -->
    <script>
        // File upload handling
        document.addEventListener('DOMContentLoaded', function() {
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('file-input');
            const fileList = document.getElementById('file-list');
            const uploadButton = document.getElementById('upload-button');
            let selectedFiles = [];

            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // Highlight drop area when drag over
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                dropArea.classList.add('border-primary', 'bg-blue-50');
                dropArea.classList.remove('border-gray-300');
            }

            function unhighlight() {
                dropArea.classList.remove('border-primary', 'bg-blue-50');
                dropArea.classList.add('border-gray-300');
            }

            // Handle dropped files
            dropArea.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
                // Add drop animation effect
                dropArea.classList.add('animate-pulse');
                setTimeout(() => {
                    dropArea.classList.remove('animate-pulse');
                }, 500);
            }

            // Handle file input change
            fileInput.addEventListener('change', function() {
                handleFiles(this.files);
            });

            // Trigger file input when drop area is clicked
            dropArea.addEventListener('click', function(e) {
                // 确保点击的不是子元素（如文件选择按钮）
                if (e.target === dropArea || !document.getElementById('file-input').contains(e.target)) {
                    // 清除之前的选择，避免弹两次
                    fileInput.value = '';
                    fileInput.click();
                }
            });
            
            // 为选择文件按钮添加点击事件
            document.querySelector('label[for="file-input"]').addEventListener('click', function(e) {
                // 阻止事件冒泡，避免触发dropArea的点击事件
                e.stopPropagation();
                // 清除之前的选择
                fileInput.value = '';
            });

            function handleFiles(files) {
                if (files.length > 0) {
                    let hasNewValidFiles = false;
                    let firstValidFile = null;
                    
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        if (validateFile(file)) {
                            selectedFiles.push(file);
                            hasNewValidFiles = true;
                            if (!firstValidFile) {
                                firstValidFile = file;
                            }
                        }
                    }
                    
                    if (hasNewValidFiles) {
                        updateFileList();
                        // Add animation to file list appearance
                        fileList.classList.add('animate-fadeIn');
                        
                        // 自动填充标题（如果标题为空）
                        const titleInput = document.getElementById('title');
                        if (titleInput && titleInput.value.trim() === '' && firstValidFile) {
                            // 去除文件扩展名作为标题
                            const fileNameWithoutExt = firstValidFile.name.replace(/\.[^/.]+$/, "");
                            titleInput.value = fileNameWithoutExt;
                        }
                    }
                }
            }

            function validateFile(file) {
                // Check file extension
                const validExtensions = ['.pdf', '.doc', '.docx', '.xls', '.xlsx', '.csv', '.txt'];
                const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
                
                if (!validExtensions.includes(fileExtension)) {
                    showError('不支持的文件格式: ' + file.name);
                    return false;
                }
                
                // Check file size (50MB limit)
                const maxSize = 50 * 1024 * 1024; // 50MB in bytes
                if (file.size > maxSize) {
                    showError('文件过大: ' + file.name + ' (最大 50MB)');
                    return false;
                }
                
                // Check if file already exists
                for (let i = 0; i < selectedFiles.length; i++) {
                    if (selectedFiles[i].name === file.name && selectedFiles[i].size === file.size) {
                        showError('文件已存在: ' + file.name);
                        return false;
                    }
                }
                
                return true;
            }

            function updateFileList() {
                if (selectedFiles.length > 0) {
                    fileList.innerHTML = '';
                    fileList.classList.remove('hidden');
                    fileList.classList.add('animate-fadeIn');
                    
                    // Add file list header
                    const header = document.createElement('div');
                    header.className = 'flex items-center justify-between py-2 border-b border-gray-200 mb-2';
                    header.innerHTML = `
                        <h4 class="font-medium text-gray-700">已选择 ${selectedFiles.length} 个文件</h4>
                        <button type="button" id="clear-all-files" class="text-sm text-primary hover:text-primary/80 transition-colors">
                            清空全部
                        </button>
                    `;
                    fileList.appendChild(header);
                    
                    // Add clear all event listener
                    document.getElementById('clear-all-files').addEventListener('click', function() {
                        clearAllFiles();
                    });
                    
                    // Add each file item with fade-in animation
                    selectedFiles.forEach((file, index) => {
                        // Get file icon based on extension
                        const iconClass = getFileIconClass(file.name);
                        
                        const fileItem = document.createElement('div');
                        fileItem.className = 'flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg mb-2 shadow-sm hover:shadow transition-all-300 animate-fadeIn';
                        fileItem.style.animationDelay = `${index * 50}ms`;
                        fileItem.innerHTML = `
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 flex items-center justify-center rounded-full ${getFileIconColor(file.name)}">
                                    <i class="fa fa-${iconClass} text-white text-lg"></i>
                                </div>
                                <div class="truncate">
                                    <div class="text-sm font-medium text-gray-900 truncate" title="${file.name}">${file.name}</div>
                                    <div class="text-xs text-gray-500">${formatFileSize(file.size)}</div>
                                </div>
                            </div>
                            <button type="button" class="remove-file-btn text-gray-400 hover:text-danger transition-colors focus:outline-none p-1" data-index="${index}">
                                <i class="fa fa-times-circle"></i>
                            </button>
                        `;
                        fileList.appendChild(fileItem);
                    });
                    
                    // Add event listeners to remove buttons
                    document.querySelectorAll('.remove-file-btn').forEach(button => {
                        button.addEventListener('click', function() {
                            const index = parseInt(this.getAttribute('data-index'));
                            const fileItem = this.closest('div');
                            // Add remove animation
                            fileItem.classList.add('opacity-0', 'scale-95');
                            setTimeout(() => {
                                removeFile(index);
                            }, 200);
                        });
                    });
                } else {
                    fileList.classList.add('hidden');
                    fileList.innerHTML = '';
                }
            }

            function removeFile(index) {
                selectedFiles.splice(index, 1);
                updateFileList();
            }

            function clearAllFiles() {
                // Add animation effect
                const fileItems = fileList.querySelectorAll('.animate-fadeIn');
                fileItems.forEach((item, index) => {
                    setTimeout(() => {
                        item.classList.add('opacity-0', 'scale-95');
                    }, index * 30);
                });
                
                // Clear after animation completes
                setTimeout(() => {
                    selectedFiles = [];
                    updateFileList();
                }, fileItems.length * 30 + 100);
            }

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            function getFileIconClass(filename) {
                const extension = filename.split('.').pop().toLowerCase();
                switch (extension) {
                    case 'pdf': return 'file-pdf-o';
                    case 'doc':
                    case 'docx': return 'file-word-o';
                    case 'xls':
                    case 'xlsx': return 'file-excel-o';
                    case 'csv': return 'file-text-o';
                    case 'txt': return 'file-text-o';
                    default: return 'file-o';
                }
            }

            function getFileIconColor(filename) {
                const extension = filename.split('.').pop().toLowerCase();
                switch (extension) {
                    case 'pdf': return 'bg-red-500';
                    case 'doc':
                    case 'docx': return 'bg-blue-500';
                    case 'xls':
                    case 'xlsx': return 'bg-green-500';
                    case 'csv': return 'bg-blue-400';
                    case 'txt': return 'bg-gray-500';
                    default: return 'bg-gray-400';
                }
            }

            function showError(message) {
                // Create error notification with Tailwind CSS
                const notification = document.createElement('div');
                notification.className = 'fixed bottom-4 right-4 bg-white border border-danger text-danger p-4 rounded-lg shadow-lg transform translate-y-16 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3';
                notification.innerHTML = `
                    <i class="fa fa-exclamation-circle text-xl"></i>
                    <span>${message}</span>
                    <button type="button" class="ml-2 text-gray-400 hover:text-gray-600" onclick="this.parentElement.remove()">
                        <i class="fa fa-times"></i>
                    </button>
                `;
                document.body.appendChild(notification);
                
                // Show notification with animation
                setTimeout(() => {
                    notification.classList.remove('translate-y-16', 'opacity-0');
                }, 10);
                
                // Auto remove after 5 seconds
                setTimeout(() => {
                    notification.classList.add('translate-y-16', 'opacity-0');
                    setTimeout(() => {
                        if (document.body.contains(notification)) {
                            document.body.removeChild(notification);
                        }
                    }, 300);
                }, 5000);
            }

            function validateForm() {
                if (selectedFiles.length === 0) {
                    showError('请至少选择一个文件上传');
                    return false;
                }
                
                const title = document.getElementById('title').value.trim();
                const category = document.getElementById('category').value;
                const date = document.getElementById('date').value;
                
                // 检查必填字段
                if (!title) {
                    showError('请输入文档标题');
                    document.getElementById('title').focus();
                    return false;
                }
                
                if (!category) {
                    showError('请选择文档类别');
                    document.getElementById('category').focus();
                    return false;
                }
                
                if (!date) {
                    showError('请选择文档日期');
                    document.getElementById('date').focus();
                    return false;
                }
                
                // Create a new FileList object with selected files
                const dataTransfer = new DataTransfer();
                selectedFiles.forEach(file => dataTransfer.items.add(file));
                fileInput.files = dataTransfer.files;
                
                // Disable submit button to prevent duplicate submissions
    uploadButton.disabled = true;
    uploadButton.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 上传中...';
    
    // Show loading mask
    const loadingMask = document.getElementById('loading-mask');
    if (loadingMask) {
        loadingMask.classList.remove('hidden');
    }
    
    return true;
            }
            
            // Add focus styles to form elements
            document.querySelectorAll('input, select, textarea').forEach(element => {
                element.addEventListener('focus', function() {
                    this.parentElement.classList.add('ring-2', 'ring-primary/30');
                });
                element.addEventListener('blur', function() {
                    this.parentElement.classList.remove('ring-2', 'ring-primary/30');
                });
            });
        });
        
        // Add animation keyframes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fadeIn {
                animation: fadeIn 0.3s ease forwards;
            }
        `;
        document.head.appendChild(style);
    </script>
    <!-- Loading Mask -->
    <div id="loading-mask" class="fixed inset-0 bg-black bg-opacity-50 z-[9999] flex flex-col items-center justify-center hidden">
        <div class="flex flex-col items-center gap-3 p-6 bg-white rounded-xl shadow-xl">
            <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
            <p class="text-lg font-medium text-gray-700">正在上传文档，请稍候...</p>
            <p class="text-sm text-gray-500">文件上传中，请勿关闭页面</p>
        </div>
    </div>
</body>
</html>
