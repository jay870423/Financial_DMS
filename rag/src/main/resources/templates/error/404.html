<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 财务文档管理系统</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#0E2E91',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F',
                        info: '#86909C',
                        background: '#F2F3F5',
                        surface: '#FFFFFF',
                        text: {
                            primary: '#1D2129',
                            regular: '#4E5969',
                            secondary: '#86909C',
                            placeholder: '#C9CDD4'
                        },
                        border: {
                            primary: '#E5E6EB',
                            secondary: '#C9CDD4'
                        }
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        card: '0 2px 12px 0 rgba(0, 0, 0, 0.08)',
                        'card-hover': '0 4px 16px 0 rgba(0, 0, 0, 0.12)',
                        dropdown: '0 6px 16px -8px rgba(0, 0, 0, 0.1), 0 9px 28px 0 rgba(0, 0, 0, 0.05)'
                    },
                    transitionProperty: {
                        'height': 'height',
                        'spacing': 'margin, padding'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow-sm {
                text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            }
            .error-code {
                font-size: clamp(8rem, 25vw, 15rem);
                line-height: 1;
                font-weight: 900;
                background: linear-gradient(45deg, #165DFF, #0E2E91);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                opacity: 0.9;
                text-shadow: 0 10px 30px rgba(22, 93, 255, 0.3);
            }
            .btn {
                @apply inline-flex items-center justify-center px-6 py-3 rounded-md font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 relative overflow-hidden;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/90 focus:ring-primary/30;
            }
            .btn-secondary {
                @apply bg-white text-text-primary border border-border-primary hover:bg-background focus:ring-primary/30;
            }
        }
    </style>
</head>
<body class="font-inter bg-background text-text-primary min-h-screen flex flex-col">
    <!-- 主内容区域 -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-12 text-center">
        <div class="max-w-2xl w-full mx-auto">
            <!-- 错误图标 --<div class="relative mb-8">
                <div class="w-32 h-32 md:w-40 md:h-40 bg-primary/10 rounded-full flex items-center justify-center mx-auto relative z-10">
                    <i class="fa fa-exclamation-circle text-6xl md:text-7xl text-primary"></i>
                </div>
                <!-- 背景装饰 -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 md:w-60 md:h-60 bg-primary/5 rounded-full -z-10"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 md:w-80 md:h-80 bg-primary/2 rounded-full -z-20"></div>
            </div>
            
            <!-- 错误代码 --<h1 class="error-code mb-4">404</h1>
            
            <!-- 错误标题和消息 --<h2 class="text-3xl font-bold text-text-primary mb-4">页面不存在</h2>
            <p class="text-text-regular text-lg mb-8 max-w-md mx-auto">抱歉，您访问的页面不存在或已被移除。请检查您的网址是否正确，或返回首页继续浏览。</p>
            
            <!-- 操作按钮 --<div class="flex flex-wrap gap-4 justify-center mb-12">
                <a href="/dashboard" class="btn btn-primary">
                    <i class="fa fa-home mr-2"></i>
                    返回首页
                </a>
                <a href="javascript:history.back()" class="btn btn-secondary">
                    <i class="fa fa-arrow-left mr-2"></i>
                    返回上一页
                </a>
            </div>
            
            <!-- 搜索建议 --<div class="bg-white rounded-lg shadow-card p-6 max-w-md mx-auto transition-all duration-300 hover:shadow-card-hover">
                <h3 class="text-lg font-semibold text-text-primary mb-3">需要找什么？</h3>
                <form action="/documents/search" method="get" class="relative">
                    <input type="text" placeholder="搜索文档、用户或功能..." name="query"
                        class="w-full px-4 py-3 pl-10 border border-border-primary rounded-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all duration-200">
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 bg-primary text-white p-2 rounded-md transition-colors duration-200 hover:bg-primary/90">
                        <i class="fa fa-search"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>
    
    <!-- 页脚 --<footer class="bg-surface border-t border-border-primary py-6">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <p class="text-text-secondary text-sm">&copy; 2024 财务文档管理系统. 保留所有权利.</p>
                </div>
                <div class="flex space-x-6">
                    <a href="/about" class="text-text-secondary hover:text-primary transition-colors duration-200 text-sm">关于系统</a>
                    <a href="/help" class="text-text-secondary hover:text-primary transition-colors duration-200 text-sm">帮助中心</a>
                    <a href="#" class="text-text-secondary hover:text-primary transition-colors duration-200 text-sm">联系我们</a>
                </div>
            </div>
        </div>
    </footer>
    
    <script>
        // 为所有按钮添加点击波纹效果
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.classList.add('absolute', 'bg-white', 'opacity-30', 'rounded-full', 'transform', 'scale-0', 'animate-ping');
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
        
        // 添加页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const mainContent = document.querySelector('main');
            mainContent.classList.add('animate-fade-in');
        });
        
        // 为搜索框添加焦点动画
        const searchInput = document.querySelector('input[name="query"]');
        if (searchInput) {
            searchInput.addEventListener('focus', function() {
                this.parentElement.classList.add('scale-[1.02]');
            });
            searchInput.addEventListener('blur', function() {
                this.parentElement.classList.remove('scale-[1.02]');
            });
        }
    </script>
</body>
</html>
