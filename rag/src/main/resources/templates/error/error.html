<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发生错误 - 财务文档管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 40px 20px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 20px;
            line-height: 1;
        }
        
        .error-title {
            font-size: 36px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        
        .error-message {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            max-width: 600px;
        }
        
        .error-actions {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .error-icon {
            width: 160px;
            height: 160px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fee2e2;
            border-radius: 50%;
        }
        
        .error-icon svg {
            width: 80px;
            height: 80px;
            color: #ef4444;
        }
        
        .error-details {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            max-width: 600px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <h1 class="error-code">500</h1>
        <h2 class="error-title">服务器内部错误</h2>
        <p class="error-message" th:text="${errorMessage ?: '抱歉，服务器发生了内部错误。我们的技术团队已经收到通知并正在处理。'}">抱歉，服务器发生了内部错误。我们的技术团队已经收到通知并正在处理。</p>
        
        <div class="error-actions">
            <a href="/dashboard" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M3 9L12 2L21 9M5 19H19V12H5V19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                返回首页
            </a>
            <a href="javascript:history.back()" class="btn btn-outline">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                返回上一页
            </a>
            <button class="btn btn-secondary" onclick="window.location.reload()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M21 12A9 9 0 0 1 6 5.3L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 12a9 9 0 0 0 15 6.7l3-2.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 21v-5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                重新加载
            </button>
        </div>
        
        <div th:if="${#developmentMode}" class="error-details">
            <strong>开发环境错误详情：</strong>
            <pre th:text="${exception}"></pre>
        </div>
    </div>
    
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-left">
                <p>&copy; 2024 财务文档管理系统. 保留所有权利.</p>
            </div>
            <div class="footer-right">
                <a href="/about" class="footer-link">关于系统</a>
                <a href="/help" class="footer-link">帮助中心</a>
                <a href="#" class="footer-link">联系我们</a>
            </div>
        </div>
    </footer>
</body>
</html>
