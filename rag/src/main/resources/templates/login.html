<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 财务文档管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#0E2E91',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F',
                        info: '#86909C',
                        background: '#F2F3F5',
                        surface: '#FFFFFF',
                        text: {
                            primary: '#1D2129',
                            regular: '#4E5969',
                            secondary: '#86909C',
                            placeholder: '#C9CDD4'
                        },
                        border: {
                            primary: '#E5E6EB',
                            secondary: '#C9CDD4'
                        }
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        card: '0 2px 12px 0 rgba(0, 0, 0, 0.08)',
                        'card-hover': '0 4px 16px 0 rgba(0, 0, 0, 0.12)',
                        dropdown: '0 6px 16px -8px rgba(0, 0, 0, 0.1), 0 9px 28px 0 rgba(0, 0, 0, 0.05)'
                    },
                    transitionProperty: {
                        'height': 'height',
                        'spacing': 'margin, padding'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .auth-input {
                @apply w-full pr-4 py-3 border border-border-primary rounded-md focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all duration-200 outline-none bg-white;
            }
            .btn-primary {
                @apply w-full bg-primary text-white py-3 px-6 rounded-md font-medium transition-all duration-200 hover:bg-primary/90 active:bg-primary/80 flex items-center justify-center relative overflow-hidden;
            }
            .btn-outline {
                @apply w-full border border-border-primary text-text-primary py-3 px-6 rounded-md font-medium transition-all duration-200 hover:bg-background flex items-center justify-center;
            }
            
            /* 图标垂直对齐调整 */
            .relative i,
            .relative svg {
                font-size: 0.875rem;
                vertical-align: middle;
                margin-top: 0;
            }
            .form-group {
                @apply relative transition-all duration-200 hover:scale-[1.01] focus-within:scale-[1.01];
            }
            .login-card {
                @apply bg-white rounded-xl shadow-card overflow-hidden transition-all duration-300 hover:shadow-card-hover;
            }
            .slide-in {
                animation: slideIn 0.3s ease-out;
            }
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        }
    </style>
</head>
<body class="font-inter bg-gradient-to-br from-background to-background/90 min-h-screen flex items-center justify-center p-4">
    <!-- 登录容器 -->
    <div class="w-full max-w-md mx-auto">
        <!-- 背景装饰 -->
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl -z-10"></div>
        <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-gradient-to-r from-primary/5 to-secondary/5 blur-3xl -z-20"></div>
        
        <!-- 登录卡片 -->
        <div class="login-card">
            <!-- 卡片头部 -->
            <div class="p-8 relative overflow-hidden">
                <!-- 顶部装饰 -->
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/10 rounded-full"></div>
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
                <div class="text-center mb-8 relative">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-full mb-4">
                        <i class="fa fa-file-text-o text-3xl text-primary"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-text-primary mb-2">财务文档管理系统</h1>
                    <p class="text-text-secondary">请登录您的账号继续访问</p>
                </div>
                
                <!-- 错误消息显示 -->
                <div th:if="${errorMessage}" class="mb-4 bg-danger/10 text-danger px-4 py-3 rounded-md text-sm">
                    <i class="fa fa-exclamation-circle mr-2"></i>
                    <span th:text="${errorMessage}"></span>
                </div>
                
                <!-- 成功消息显示 -->
                <div th:if="${successMessage}" class="mb-4 bg-success/10 text-success px-4 py-3 rounded-md text-sm">
                    <i class="fa fa-check-circle mr-2"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                
                <!-- 登录表单 -->
                <form th:action="@{/login}" method="post" class="space-y-5">
                    <div class="form-group">
                        <label for="username" class="block text-sm font-medium text-text-primary mb-1">用户名/邮箱</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-secondary">
                                <i class="fa fa-user"></i>
                            </span>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="auth-input pl-14"
                                placeholder="请输入用户名或邮箱" 
                                required
                            >
                        </div>
                    </div>
                
                    <div class="form-group">
                        <label for="password" class="block text-sm font-medium text-text-primary mb-1">密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-secondary">
                                <i class="fa fa-lock"></i>
                            </span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="auth-input pl-14"
                                placeholder="请输入密码" 
                                required
                            >
                            <button 
                                type="button" 
                                class="toggle-password absolute inset-y-0 right-0 flex items-center pr-3 text-text-secondary hover:text-text-primary transition-colors"
                                onclick="togglePasswordVisibility(this)"
                            >
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input 
                                type="checkbox" 
                                id="remember-me" 
                                name="remember-me" 
                                class="h-4 w-4 text-primary focus:ring-primary/30 border-border-primary rounded"
                            >
                            <label for="remember-me" class="ml-2 block text-sm text-text-regular">记住我</label>
                        </div>
                        <a href="#" class="text-sm text-primary hover:text-primary/80 transition-colors">忘记密码?</a>
                    </div>
                    <button type="submit" class="btn-primary mt-6 group">
                        <i class="fa fa-sign-in mr-2 transition-transform duration-200 group-hover:translate-x-1"></i>
                        登录
                        <span class="ripple"></span>
                    </button>
                </form>
            </div>
            <!-- 分隔线 -->
            <div class="relative flex items-center justify-center px-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-border-primary"></div>
                </div>
                <div class="relative bg-white px-4">
                    <span class="text-sm text-text-secondary">或通过以下方式登录</span>
                </div>
            </div>
            <!-- 社交登录按钮 -->
            <div class="p-8 pt-6 pb-6">
                <a th:href="@{/wechat/login}" class="btn-outline hover:bg-green-50 transition-colors">
                    <i class="fa fa-weixin text-[#07C160] mr-2"></i>
                    微信扫码登录
                </a>
                <div class="grid grid-cols-2 gap-3 mt-3">
                    <a href="#" class="btn-outline flex justify-center items-center space-x-2 hover:bg-blue-50">
                        <i class="fa fa-github text-gray-800"></i>
                        <span class="text-sm">GitHub</span>
                    </a>
                    <a href="#" class="btn-outline flex justify-center items-center space-x-2 hover:bg-red-50">
                        <i class="fa fa-envelope text-red-500"></i>
                        <span class="text-sm">邮箱验证</span>
                    </a>
                </div>
            </div>
            <!-- 注册链接 -->
            <div class="px-8 py-6 bg-background border-t border-border-primary rounded-b-xl">
                <div class="text-center">
                    <span class="text-sm text-text-regular">还没有账号?</span>
                    <a th:href="@{/register}" class="text-sm text-primary font-medium hover:text-primary/80 transition-colors ml-1 inline-flex items-center">
                        立即注册
                        <i class="fa fa-arrow-right ml-1 text-xs"></i>
                    </a>
                </div>
            </div>
        </div>
        <!-- 页脚 -->
        <div class="mt-6 text-center text-sm text-text-secondary">
            <p>&copy; 2024 财务文档管理系统. 保留所有权利.</p>
        </div>
    </div>
    <script>
        // 切换密码可见性
        function togglePasswordVisibility(button) {
            const passwordInput = button.previousElementSibling;
            const icon = button.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // 表单验证和增强交互
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            
            // 输入框聚焦效果增强
            [username, password].forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('transition-transform');
                });
                
                input.addEventListener('blur', function() {
                    // 移除缩放效果已通过CSS的form-group处理
                });
            });
            
            // 为按钮添加波纹效果
            document.querySelectorAll('button, a[href]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    if (this.tagName === 'A' && this.href.includes('javascript:')) return;
                    
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('absolute', 'bg-white', 'opacity-30', 'rounded-full', 'transform', 'scale-0', 'animate-ping');
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });
            
            // 表单提交验证
            form.addEventListener('submit', function(e) {
                let isValid = true;
                let errorMessage = '';
                
                if (!username.value.trim()) {
                    isValid = false;
                    errorMessage = '请输入用户名或邮箱';
                    username.classList.add('border-danger');
                    setTimeout(() => username.classList.remove('border-danger'), 2000);
                }
                
                if (!password.value) {
                    isValid = false;
                    errorMessage = '请输入密码';
                    password.classList.add('border-danger');
                    setTimeout(() => password.classList.remove('border-danger'), 2000);
                }
                
                if (!isValid) {
                    e.preventDefault();
                    
                    // 创建临时错误提示
                    let existingToast = document.querySelector('.error-toast');
                    if (existingToast) existingToast.remove();
                    
                    const toast = document.createElement('div');
                    toast.className = 'error-toast fixed top-4 right-4 bg-danger text-white px-4 py-3 rounded-md shadow-lg z-50 slide-in';
                    toast.innerHTML = `<i class="fa fa-exclamation-circle mr-2"></i>${errorMessage}`;
                    document.body.appendChild(toast);
                    
                    // 3秒后移除提示
                    setTimeout(() => {
                        toast.style.transition = 'all 0.3s ease';
                        toast.style.transform = 'translateX(100%)';
                        toast.style.opacity = '0';
                        setTimeout(() => toast.remove(), 300);
                    }, 3000);
                }
            });
            
            // 添加页面加载动画
            const loginCard = document.querySelector('.login-card');
            if (loginCard) {
                loginCard.style.opacity = '0';
                loginCard.style.transform = 'translateY(20px)';
                loginCard.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                
                setTimeout(() => {
                    loginCard.style.opacity = '1';
                    loginCard.style.transform = 'translateY(0)';
                }, 100);
            }
        });
    </script>
</body>
</html>
